name: OpenStreetMap places
on:
  push:
    branches: [main]
    paths: ['tools/osm-places.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/osm-places.mjs
      - run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          git add osm/places.json
          git commit -m "OpenStreetMap places" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
